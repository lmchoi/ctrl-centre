name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells us nothing useful on a single-author repo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the engines floor declared in package.json; 26 is what
        # development actually happens on.
        node: [20, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # devDependencies only — the app itself needs nothing installed (ADR 0003),
      # but `npm run typecheck` needs tsc.
      - run: npm ci
      - run: npm run check
